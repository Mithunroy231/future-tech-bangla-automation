name: Future Tech Automation

on:
  workflow_dispatch:
  push:
    paths:
      - 'config.json'
      - 'workflow.json'
      - '.github/workflows/check-config.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JSON configuration
        run: |
          python -m json.tool config.json
          python -m json.tool workflow.json

      - name: Confirm workflow steps
        run: |
          python -c "import json; d=json.load(open('workflow.json')); assert len(d['steps']) > 0; print('Workflow configuration is valid!')"
